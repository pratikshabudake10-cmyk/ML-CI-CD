name: ML CI
"on": [push]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install pytest
        run: pip install pytest
      - name: run tests
        run: pytest

